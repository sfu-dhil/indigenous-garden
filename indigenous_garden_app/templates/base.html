{% load static %}
{% load django_vite %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="google" content="notranslate" />
        <title>SFU Indigenous Garden Map</title>
        <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

        <link rel="stylesheet" href="{% static 'django_dh_map/dist/django_dh_map.css' %}">
        <script src="{% static 'django_dh_map/dist/django_dh_map.js' %}" defer></script>
        {% vite_hmr_client %}
        {% vite_asset 'indigenous-garden.js' crossorigin="" %}
        {% block styles %}
        {% endblock %}
    </head>
    <body class="d-flex flex-column min-vh-100">
        <main class="flex-grow-1 bg-secondary-subtle">
            {% block content %}
            {% endblock %}
        </main>
        {% block javascript %}
        {% endblock %}
    </body>
</html>
